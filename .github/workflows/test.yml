name: CI

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/**'
      - 'integration/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/**'
      - 'integration/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: run clippy
        run: cargo clippy --workspace -- -D warnings || true # Keep true for now in case of warnings

      - name: run unit tests
        run: cargo test --workspace

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git-lfs

      - name: prepare environment
        run: cp .env.example .env

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build images with Buildx Bake
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          load: true
          set: |
            xet-server.cache-from=type=gha,scope=xet-server
            xet-server.cache-to=type=gha,scope=xet-server,mode=max
            test-runner.cache-from=type=gha,scope=test-runner
            test-runner.cache-to=type=gha,scope=test-runner,mode=max

      - name: start Docker Compose stack
        run: |
          docker compose up -d --wait

      - name: run shell e2e tests
        run: |
          ./tests/e2e/run_e2e.sh --no-build --keep-up
          ./tests/e2e/run_hf_xet_e2e.sh --no-build --keep-up --use-docker

      - name: run Hub API integration tests
        run: |
          uv run integration/roundtrip.py
          uv run integration/integration_repo_search.py
          uv run integration/integration_upload_file.py
          uv run integration/integration_upload_folder.py
          uv run integration/integration_create_commit.py
          uv run integration/integration_create_commit_deletions.py
          uv run integration/integration_model_card.py
          uv run integration/integration_hffilesystem.py
          uv run integration/test_downloads.py

      - name: fetch Docker logs on failure
        if: failure()
        run: |
          touch .env
          docker compose logs
