name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: run clippy
        run: cargo clippy --workspace -- -D warnings || true # Keep true for now in case of warnings

      - name: run unit tests
        run: cargo test --workspace

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git-lfs

      - name: start Docker Compose stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: run shell E2E tests
        run: |
          ./tests/e2e/run_e2e.sh --no-build --keep-up
          ./tests/e2e/run_hf_xet_e2e.sh --no-build --keep-up --use-docker

      - name: run Python Hub API integration tests
        run: |
          uv run integration/roundtrip.py
          uv run integration/integration_repo_search.py
          uv run integration/integration_upload_file.py
          uv run integration/integration_upload_folder.py
          uv run integration/integration_create_commit.py
          uv run integration/integration_create_commit_deletions.py
          uv run integration/integration_model_card.py
          uv run integration/integration_hffilesystem.py
          uv run integration/test_downloads.py

      - name: fetch Docker logs on failure
        if: failure()
        run: |
          touch .env
          docker compose logs
