version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    reviewers:
      - "DiTo97"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    reviewers:
      - "DiTo97"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "/"
    open-pull-requests-limit: 5
    reviewers:
      - "DiTo97"
