
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xet
      POSTGRES_PASSWORD: xet
      POSTGRES_DB: xetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xet -d xetdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/xet-storage --ignore-existing
      "

  xet-server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file: ../.env
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://xet:xet@postgres:5432/xetdb
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      CAS_BASE_URL: http://localhost:8080
      HUB_BASE_URL: http://localhost:8080
      TEMPLATE_DIR: /app/templates
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 15

  test-runner:
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile.test-runner
    volumes:
      - ./tests:/tests:ro
    environment:
      CAS_URL: http://xet-server:3000
      S3_REWRITE_FROM: http://localhost:9000
      S3_REWRITE_TO: http://minio:9000
    depends_on:
      xet-server:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres_data:
  minio_data:
